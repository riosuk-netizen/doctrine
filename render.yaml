services:
  - type: web
    name: riftwatch-doctrines
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      # Postgres connection string from Neon (neon.tech). Set it in the Render dashboard.
      - key: DATABASE_URL
        sync: false
