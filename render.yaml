services:
  - type: web
    name: doctrine-hub
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn main:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
    # If you want a persistent Postgres DB instead of the free-tier's
    # ephemeral SQLite file, add a Render Postgres instance and set
    # DATABASE_URL here (or in the dashboard) to its connection string.
